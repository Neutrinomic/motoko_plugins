[package]
name = "motoko-compute-ed25519"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", path = "vendor/ed25519-dalek", default-features = false, features = ["fast", "hazmat", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", path = "vendor/curve25519-dalek", default-features = false, features = ["precomputed-tables", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

[dev-dependencies]
serde_json = "=1.0.149"
