[package]
name = "motoko-compute-ed25519"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["precomputed-tables", "zeroize"] }

[dev-dependencies]
serde_json = "=1.0.149"
