[package]
name = "motoko-compute-p256"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ecdsa = { version = "=0.16.9", default-features = false, features = ["signing"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", default-features = false }
