[package]
name = "round5-ed25519-independent-audit"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "native.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", path = "../../../../plugins/ed25519/runtime/vendor/ed25519-dalek", default-features = false, features = ["fast", "hazmat", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", path = "../../../../plugins/ed25519/runtime/vendor/curve25519-dalek", default-features = false, features = ["precomputed-tables", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
serde_json = "=1.0.149"
