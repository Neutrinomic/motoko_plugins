name: plugins

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop ./_build/motoko --command bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the compiler pin
        id: compiler
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          pin = json.loads(Path("toolchains/motoko.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"repository={pin['repository']}", file=output)
              print(f"revision={pin['revision']}", file=output)
          PY

      - name: Check out the matching compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.compiler.outputs.repository }}
          ref: ${{ steps.compiler.outputs.revision }}
          path: _build/motoko
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ic-hs-test
          skipPush: true

      - name: Build the compiler, RTS, and plugin packages
        run: |
          make -C _build/motoko/rts
          scripts/build.sh --motoko "$PWD/_build/motoko"

      - name: Test kernels, interpreters, Wasm, packages, and GC
        run: scripts/test.sh --motoko "$PWD/_build/motoko"

      - name: Validate the archived benchmark summary
        run: |
          python3 benchmarks/summarize-comparison.py \
            benchmarks/results/native-comparison/main.json \
            benchmarks/results/native-comparison/static-arrays.json \
            benchmarks/results/native-comparison/repeated-variants.json \
            --expected-cases 40 --expected-trials 3 \
            --out _build/archived-summary.csv
          cmp benchmarks/results/native-comparison/summary.csv _build/archived-summary.csv
