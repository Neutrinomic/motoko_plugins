[workspace]
members = ["plugins/*/runtime"]
exclude = [
  "_build",
  "plugins/secp256k1/runtime/vendor/k256",
  "plugins/ed25519/runtime/vendor/ed25519-dalek",
  "plugins/ed25519/runtime/vendor/curve25519-dalek",
  "plugins/p256/runtime/vendor/p256",
  "plugins/p256/runtime/vendor/primeorder",
  "plugins/ml-dsa/runtime/vendor/fips204",
  "plugins/bls12-381/runtime/vendor/bls12_381",
]
resolver = "3"

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = true
strip = "debuginfo"

[profile.dev]
panic = "abort"
